<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sirup.gg — one MCP endpoint for your whole company</title>
    <meta
      name="description"
      content="Connect every MCP server your company uses. Give your AI clients one endpoint."
    />
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      (() => {
        const stored = localStorage.getItem("sirup-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
